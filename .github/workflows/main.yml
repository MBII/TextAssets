name: Package Assets
on:
  workflow_dispatch:
  push:
    branches: [ master, vNext, buildTest-* ]

jobs:

  package:
    name: Package & Upload
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v2
            
      - name: Package Files
        shell: powershell
        run: |
          $GAMEDATA = "C:\Program Files (x86)\LucasArts\Star Wars Jedi Knight Jedi Academy\GameData"
          $MBII = $GAMEDATA + "\MBIITest"
          svn cleanup --vacuum-pristines $GAMEDATA
          svn update $MBII
          $LegendsPk3 = $MBII + "\z_MBLegends.pk3"
          $LegendsZip = $MBII + "\z_MBLegends.zip"
          $Assets3 = $MBII + "\MBAssets3.pk3"
          Get-FileHash $Assets3
          cd MBAssets3
          deterministic_zip -D -r ../MBAssets3.pk3 ./
          Get-FileHash ../MBAssets3.pk3
          cd ../03_MovieGameMappack
          deterministic_zip -D -r  ../03_MovieGameMappack.pk3 ./
          cd ../mb2_cmp_assets3
          deterministic_zip -D -r  ../mb2_cmp_assets3.pk3 ./
          cd ../mb2_um_assets3
          deterministic_zip -D -r  ../mb2_um_assets3.pk3 ./
          cd ../mb2_pb_assets2
          deterministic_zip -D -r  ../mb2_pb_assets2.pk3 ./
          cd ../MB_Effects2
          deterministic_zip -D -r  ../MB_Effects2.pk3 ./
          cd ..
          mkdir .\temp\
          Remove-Item -Path $LegendsZip -ErrorAction SilentlyContinue
          Rename-Item -Path $LegendsPk3 -NewName $LegendsZip
          Expand-Archive -Path ($MBII + "\z_MBLegends.zip") -DestinationPath .\temp\ -Force
          Rename-Item -Path $LegendsZip -NewName $LegendsPk3
          robocopy .\z_MBLegends\ext_data .\temp\ext_data /MIR /R:0 /W:0
          cd temp
          deterministic_zip -D -r ../z_MBLegends.pk3 ./
          cd ..
          Remove-Item -Recurse -Force .\temp\
          
      - name: Upload Files
        shell: powershell
        run: |
            $GAMEDATA = "C:\Program Files (x86)\LucasArts\Star Wars Jedi Knight Jedi Academy\GameData"
            $MBII = $GAMEDATA + "\MBIITest"
            svn status $GAMEDATA
            svn revert -R $GAMEDATA
            svn cleanup --vacuum-pristines $GAMEDATA
            svn update --accept=theirs-full $MBII
            svn status $GAMEDATA
            Write-Host "[$(Get-Date -Format o)] Starting PK3 asset moves..."

            $filesToMove = @(
              @{ Name = "MBAssets3.pk3";            Dest = "$MBII\MBAssets3.pk3" }
              @{ Name = "03_MovieGameMappack.pk3";  Dest = "$MBII\03_MovieGameMappack.pk3" }
              @{ Name = "mb2_cmp_assets3.pk3";      Dest = "$MBII\mb2_cmp_assets3.pk3" }
              @{ Name = "mb2_um_assets3.pk3";       Dest = "$MBII\mb2_um_assets3.pk3" }
              @{ Name = "mb2_pb_assets2.pk3";       Dest = "$MBII\mb2_pb_assets2.pk3" }
              @{ Name = "MB_Effects2.pk3";          Dest = "$MBII\MB_Effects2.pk3" }
              @{ Name = "z_MBLegends.pk3";          Dest = "$MBII\z_MBLegends.pk3" }
            )

            $successCount = 0
            $failCount = 0

            foreach ($file in $filesToMove) {
              $src = $file.Name
              $dst = $file.Dest

              Write-Host "[$(Get-Date -Format o)] Moving '$src' → '$dst'..."

              try {
                Move-Item -Force -Path $src -Destination $dst -ErrorAction Stop
                Write-Host "[$(Get-Date -Format o)] SUCCESS: '$src' moved."
                $successCount++
              }
              catch {
                Write-Host "[$(Get-Date -Format o)] ERROR: Failed to move '$src'."
                Write-Host "[$(Get-Date -Format o)] Exception: $($_.Exception.Message)"
                $failCount++
              }
            }
            
            Write-Host "[$(Get-Date -Format o)] Move operation complete. Successes: $successCount, Failures: $failCount"
            $BRANCH = "${{github.ref}}".Split("/")[2]
            $HASH = "${{github.sha}}".Substring(0, 7)
            svn commit -m "Text Assets based on : $BRANCH/$HASH" $MBII
            svn update $MBII | out-file $MBII/svn_log.txt -encoding ASCII
